<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable</title>
  <meta name="robots" content="noindex">
  <!-- Page autonome : GitHub Pages l'affiche à n'importe quelle profondeur d'URL,
       donc pas de chemins relatifs ici (styles en ligne, liens calculés par script). -->
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;text-align:center;font-family:system-ui,sans-serif;color:#1a1240;background:radial-gradient(circle at 20% 10%,#56e4ff80,transparent 50%),radial-gradient(circle at 85% 90%,#ff4fa355,transparent 50%),#f3eeff}
    .w{max-width:460px;background:#fff;border:2px solid #1a1240;border-radius:20px;box-shadow:6px 6px 0 #1a1240;overflow:hidden}
    .b{background:linear-gradient(135deg,#56e4ff,#b9a1ff,#ff4fa3);border-bottom:2px solid #1a1240;padding:.5rem 1rem;font:500 .8rem ui-monospace,monospace;text-align:left}
    .c{padding:2rem 1.5rem}
    h1{font-size:4rem;margin:0}
    a{display:inline-block;margin-top:1rem;padding:.8rem 1.5rem;border:2px solid #1a1240;border-radius:999px;background:#ff4fa3;color:#fff;font-weight:700;text-decoration:none;box-shadow:3px 3px 0 #1a1240}
  </style>
</head>
<body>
  <div class="w">
    <div class="b">erreur_404.exe</div>
    <div class="c">
      <h1>404 ✦</h1>
      <p>Oups, cette page n'existe pas (ou plus).</p>
      <a id="home" href="/">Retour à l'accueil</a>
    </div>
  </div>
  <script>
    // Calcule l'URL de l'accueil selon que le site est à la racine ou dans un dépôt "projet".
    (function () {
      var repo = ""; // ← mettre le nom du dépôt ici (comme repoName dans site-config.js), ou laisser vide
      document.getElementById("home").href = repo ? "/" + repo + "/" : "/";
    })();
  </script>
</body>
</html>
